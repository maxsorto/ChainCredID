[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# EAS.sol (used in tests to deploy the real attestation service) pins 0.8.28.
solc = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@ethereum-attestation-service/eas-contracts/=lib/eas-contracts/",
]

[profile.ci]
fuzz = { runs = 1000 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"

[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
anvil = "http://127.0.0.1:8545"

[etherscan]
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }

[lint]
# `UID` matches EAS naming (schemaUID); keccak256(bytes(name)) is kept readable over inline asm.
exclude_lints = ["mixed-case-function", "asm-keccak256"]
